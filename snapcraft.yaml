base: core26
name: projectlibre
summary: Project Management software - alternative to Microsoft Project
description: |

  ProjectLibre is project management software, the leading alternative to
  Microsoft Project. A compliment to OpenOffice and LibreOffice. We have a
  community site with over 115,000 project management members as well at
  http://www.projectlibre.org It has been downloaded over 4,000,000 times in 200
  countries and won InfoWorld "Best of Open Source" award. ProjectLibre is
  compatible with Microsoft Project 2003, 2007 and 2010 files. You can simply
  open them on Linux, Mac OS or Windows. ProjectLibre has been rewritten and
  added key features::

  * Compatibility with Microsoft Project
  * Gantt Chart
  * Network Diagram
  * WBS/RBS charts
  * Earned Value Costing
  * Resource Histograms

  Homepage: https://sourceforge.net/projects/projectlibre/

confinement: strict
grade: stable
title: ProjectLibre
icon: snap/gui/projectlibre.png
adopt-info: projectlibre
website: https://sourceforge.net/projects/projectlibre/
source-code: https://sourceforge.net/p/projectlibre/code/
issues: https://sourceforge.net/p/projectlibre/tickets/
contact: jean-baptiste@ubuntu.com
license: CPAL-1.0

apps:
  projectlibre:
    command: bin/desktop-launch $SNAP/projectlibre/projectlibre.sh
    plugs: 
      - cups-control
      - desktop
      - desktop-legacy
      - home
      - network
      - x11
    environment:
      _JAVA_OPTIONS: -Duser.home=$SNAP_USER_DATA
      JAVA_HOME: $SNAP/usr/lib/jvm/java-21-openjdk-amd64
      PATH: $SNAP/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH

parts:
  desktop-glib:
    source: https://github.com/ubuntu/snapcraft-desktop-helpers.git
    source-commit: 76be98fecb40165bc162a8a1be084c9b9da16cd8
    source-subdir: glib-only
    plugin: make
    build-packages:
      - libglib2.0-dev
    stage-packages:
      - libglib2.0-bin
      - shared-mime-info
      - fonts-ubuntu
      - xdg-user-dirs

  projectlibre:
    after: [desktop-glib]
    plugin: nil
    source: .
    override-build: |
        set -eu
        mkdir -p $SNAPCRAFT_PART_INSTALL/projectlibre
        tar xzf projectlibre*.tar.gz -C $SNAPCRAFT_PART_INSTALL/projectlibre --strip-components=1
        chmod +x $SNAPCRAFT_PART_INSTALL/projectlibre/projectlibre.sh

        # Register the application/x-projectlibre mime type (see snap/gui/
        # projectlibre.xml) under usr/share/mime so the desktop-launch helper
        # compiles it into the user mime db. Note: .pod detection cannot win
        # against shared-mime-info's application/x-perl glob for *.pod, so
        # host file managers still see Perl POD; a real fix needs an upstream
        # extension/mime-type change (see issue #5).
        mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/mime/packages
        cp snap/gui/projectlibre.xml $SNAPCRAFT_PART_INSTALL/usr/share/mime/packages/

        # cacerts is created by a post-install script of ca-certificates-java
        # but /etc/ is shadowed in the snap, so we need to copy it manually.
        cd $SNAPCRAFT_PART_INSTALL/usr/lib/jvm/java-21-openjdk-amd64/lib/security/
        rm -f cacerts
        cp "$SNAPCRAFT_PART_INSTALL/etc/ssl/certs/java/cacerts" .
        cd -

        craftctl set version="$(ls projectlibre-*.tar.gz|sed 's/.*-\([^-]\+\).tar.gz/\1/'|tr -s '_' '-')"
    prime:
      - -usr/share/doc
      - -usr/share/man
    build-packages:
      - ca-certificates-java
      - openjdk-21-jre
    stage-packages:
      - ca-certificates-java
      - openjdk-21-jre
